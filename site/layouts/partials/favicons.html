{{/* Refresh cached tab icons when the favicon artwork changes. */}}
{{ $version := substr (crypto.SHA256 (os.ReadFile "static/favicon-32x32.png")) 0 12 }}
<link rel="icon" type="image/x-icon" href="{{ "favicon.ico" | relURL }}?v={{ $version }}">
<link rel="icon" type="image/png" sizes="32x32" href="{{ "favicon-32x32.png" | relURL }}?v={{ $version }}">
<link rel="icon" type="image/png" sizes="16x16" href="{{ "favicon-16x16.png" | relURL }}?v={{ $version }}">
<link rel="apple-touch-icon" sizes="180x180" href="{{ "apple-touch-icon.png" | relURL }}?v={{ $version }}">
<link rel="manifest" href="{{ "site.webmanifest" | relURL }}?v={{ $version }}">
