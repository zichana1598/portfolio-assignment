{{ $title := .Get "title" }}
{{ $tech := .Get "tech" }}
{{ $url := relref .Page (.Get "url") }}

<a href="{{ $url | safeURL }}"
   class="not-prose group block rounded-lg border border-neutral-300 bg-white/60 p-5 shadow-sm transition duration-200 hover:-translate-y-1 hover:border-primary-300 hover:shadow-xl hover:shadow-primary-500/10 dark:border-neutral-600 dark:bg-neutral-900/50 dark:hover:border-primary-700">

  <article>
    <h3 class="text-xl font-bold text-neutral-800 dark:text-neutral-100">
      {{ $title }}
    </h3>

    <p class="mt-2 text-sm font-medium text-primary-600 dark:text-primary-400">
      {{ $tech }}
    </p>

    <div class="mt-3 text-sm leading-6 text-neutral-600 dark:text-neutral-300">
      {{ .Inner | markdownify }}
    </div>
  </article>

</a>
